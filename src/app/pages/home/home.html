<section class="home">
  <div class="hero">
    <img
      class="hero__logo"
      src="brand-logo.jpg"
      alt="Chsistems — Tecnología sin límites"
    />
    <h1>Panel de control</h1>
    <p>Angular, Express y MongoDB conectados.</p>
  </div>

  <div class="status-card">
    <div class="status-header">
      <span
        class="dot"
        [class.ok]="health()?.status === 'ok'"
        [class.fail]="error() !== null"
      ></span>
      <h2>Estado del sistema</h2>
    </div>

    @if (loading()) {
      <p class="muted">Consultando API...</p>
    } @else if (error()) {
      <p class="error">{{ error() }}</p>
    } @else if (health(); as h) {
      <ul>
        <li><span>API</span><strong>{{ h.status }}</strong></li>
        <li><span>Base de datos</span><strong>{{ h.database }}</strong></li>
        <li><span>Uptime</span><strong>{{ h.uptime.toFixed(0) }} s</strong></li>
      </ul>
    }

    <button type="button" (click)="checkStatus()" [disabled]="loading()">
      Actualizar
    </button>
  </div>
</section>
