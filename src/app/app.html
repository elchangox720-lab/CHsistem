<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/">
      <img
        class="brand__logo"
        src="brand-emblem.png"
        alt="Chsistems"
        width="36"
        height="36"
      />
      <span>{{ title() }}</span>
    </a>
    <nav class="nav">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Inicio
      </a>
    </nav>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<footer class="footer">
  <span>{{ title() }} · Angular + Express + MongoDB</span>
</footer>
